[build]
  command = "npm run build"
  publish = "dist"

# Preserve public image URLs after the lossless WebP conversion.
[[redirects]]
  from = "/img/projects/bruno.png"
  to = "/img/projects/bruno.webp"
  status = 301

[[redirects]]
  from = "/img/projects/livo.png"
  to = "/img/projects/livo.webp"
  status = 301

[[redirects]]
  from = "/img/projects/picswipe.png"
  to = "/img/projects/picswipe.webp"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
